# NanoMQ Configuration (HOCON format) — ZiZu e606
# 仅保留 MQTT 核心; http_server 段已移除 (新版镜像 REST handler bug)

mqtt {
    max_packet_size = 256MB
    max_mqueue_len = 2048
}

listeners.tcp {
    bind = "0.0.0.0:1883"
}

listeners.ws {
    bind = "0.0.0.0:8084"
}

sqlite {
    enable = true
    disk_cache_size = 102400
    flushed_mem_threshold = 100
    max_file_size = 204800
}

log {
    to = file
    level = info
    dir = "/tmp"
    file = "nanomq.log"
}
