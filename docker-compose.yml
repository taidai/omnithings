# ============================================================
# OmniThings IoT Platform - Docker Compose (e606 全栈编排)
#
# 四服务: TimescaleDB + FastAPI(Backend) + NanoMQ + Frontend(Nginx)
# 参考: https://github.com/fastapi/full-stack-fastapi-template 的分层结构
#
# ┌─────────────────────────────────────────────────────────┐
# │  e606 内核裁剪版 (5.10.160) 避坑铁律 — 缺一不可:          │
# │  1. tmpfs: - /dev/mqueue   (内核无 CONFIG_POSIX_MQUEUE)  │
# │  2. network_mode: host     (内核无 CONFIG_VETH,          │
# │                             bridge 网络残废)              │
# └─────────────────────────────────────────────────────────┘
#
# 端口分配 (host 网络 = 直接占宿主机端口):
#   5432  — TimescaleDB
#   1883  — NanoMQ MQTT (Neuron 推送目标)
#   9000  — FastAPI
#   3000  — Frontend (Nginx)
# ============================================================

services:
  # ══════════════════════════════════════════
  # TimescaleDB (时序 + 关系数据库) @5432
  # ══════════════════════════════════════════
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: omnithings-tsdb
    restart: unless-stopped
    network_mode: host                     # 避坑铁律 #2
    tmpfs:
      - /dev/mqueue                        # 避坑铁律 #1
    environment:
      POSTGRES_USER: ${DB_USER:-omnithings}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-omnidev_2026}
      POSTGRES_DB: ${DB_NAME:-omnithings}
      TIMESCALEDB_TELEMETRY: 'off'
    volumes:
      - tsdb_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro   # 001-schema.sql 首次自动执行
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-omnithings} -d ${DB_NAME:-omnithings} -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ══════════════════════════════════════════
  # NanoMQ (MQTT Broker) @1883
  # 注: 配置仅保留 MQTT 核心 (http_server 段已移除,
  #     新版镜像 REST server 有 handler 注册 bug)
  # ══════════════════════════════════════════
  nanomq:
    image: emqx/nanomq:latest
    container_name: omnithings-nanomq
    restart: unless-stopped
    network_mode: host                     # 避坑铁律 #2
    tmpfs:
      - /dev/mqueue                        # 避坑铁律 #1
    volumes:
      # 注意: 镜像内配置路径是 /usr/local/nanomq/nanomq.conf (不是 /etc!)
      - ./config/nanomq.conf:/usr/local/nanomq/nanomq.conf:ro
      - nanomq_data:/usr/local/nanomq/data
    healthcheck:
      test: ["CMD-SHELL", "nanomq_cli dscv | grep -q . || exit 0"]  # 宽松检查
      interval: 15s
      timeout: 5s
      retries: 3

  # ══════════════════════════════════════════
  # FastAPI Backend (F0 数据管道) @9000
  #
  # 镜像说明: e606 内核裁剪版无法 docker build (RUN 挂 mqueue/veth)
  # 镜像制作方式 (任选其一):
  #   A. 本地 buildx 交叉编译: docker buildx build --platform linux/arm64 \
  #        -t omnithings:0.1.0 ./backend --load && docker save | scp | docker load
  #   B. 服务器 docker run + pip install + docker commit (见 deploy-e606.md)
  # 因此此处仅用 image, 不配置 build 段
  # ══════════════════════════════════════════
  backend:
    image: omnithings:0.1.0
    container_name: omnithings
    restart: unless-stopped
    network_mode: host                     # 避坑铁律 #2
    tmpfs:
      - /dev/mqueue                        # 避坑铁律 #1
    env_file:
      - .env
    environment:
      # host 网络下通过 127.0.0.1 直连同宿主服务
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      MQTT_HOST: 127.0.0.1
      MQTT_PORT: 1883
    volumes:
      - ./backend/app:/app/app:ro           # 开发热加载
      - omnithings-data:/app/data
    working_dir: /app
    command: >
      sh -c "uvicorn app.main:app
      --host 0.0.0.0
      --port ${APP_PORT:-9000}
      --log-level ${LOG_LEVEL:-info}
      ${UVICORN_EXTRA_ARGS:-}"
    depends_on:
      timescaledb:
        condition: service_healthy
      nanomq:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${APP_PORT:-9000}/api/v1/health')"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5

  # ══════════════════════════════════════════
  # Frontend (React + Nginx) @3000
  # 本地 build dist → 挂载到 nginx 静态目录
  # ══════════════════════════════════════════
  frontend:
    image: nginx:alpine
    container_name: omnithings-frontend
    restart: unless-stopped
    network_mode: host                     # 避坑铁律 #2
    tmpfs:
      - /dev/mqueue                        # 避坑铁律 #1
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  tsdb_data:
  nanomq_data:
  omnithings-data:
